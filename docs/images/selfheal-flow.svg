<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Self-heal process after Windows Update</title>
  <desc id="desc">Five steps: Windows Update replaces termsrv.dll, reboot, scheduled task, regenerate offsets, concurrent RDP sessions restored.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #F8FAFC; }
      .step { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .num { fill: #0EA5E9; }
      .numText { fill: #FFFFFF; font-family: Segoe UI, system-ui, sans-serif; font-size: 14px; font-weight: 700; }
      .label { fill: #0F172A; font-family: Segoe UI, system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      .sub { fill: #475569; font-family: Segoe UI, system-ui, sans-serif; font-size: 11px; }
      .title { fill: #0F172A; font-family: Segoe UI, system-ui, sans-serif; font-size: 20px; font-weight: 700; }
      .line { stroke: #0EA5E9; stroke-width: 2.5; fill: none; }
      .caption { fill: #64748B; font-family: Segoe UI, system-ui, sans-serif; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0B1220; }
        .step { fill: #111827; stroke: #334155; }
        .label, .title { fill: #F8FAFC; }
        .sub, .caption { fill: #94A3B8; }
        .line { stroke: #38BDF8; }
        .num { fill: #38BDF8; }
      }
    ]]></style>
  </defs>
  <rect class="bg" width="960" height="280" rx="16"/>
  <text class="title" x="32" y="40">Self-heal after Windows Update</text>
  <text class="caption" x="32" y="60">Automatic repair path from broken termsrv.dll to concurrent Active RDP sessions</text>

  <!-- connector -->
  <path class="line" d="M110 150 H850"/>

  <!-- steps -->
  <g transform="translate(40,100)">
    <rect class="step" width="150" height="120" rx="12"/>
    <circle class="num" cx="24" cy="24" r="14"/>
    <text class="numText" x="24" y="29" text-anchor="middle">1</text>
    <text class="label" x="75" y="55" text-anchor="middle">Windows Update</text>
    <text class="sub" x="75" y="75" text-anchor="middle">replaces</text>
    <text class="sub" x="75" y="92" text-anchor="middle">termsrv.dll</text>
  </g>

  <g transform="translate(210,100)">
    <rect class="step" width="150" height="120" rx="12"/>
    <circle class="num" cx="24" cy="24" r="14"/>
    <text class="numText" x="24" y="29" text-anchor="middle">2</text>
    <text class="label" x="75" y="55" text-anchor="middle">Reboot</text>
    <text class="sub" x="75" y="75" text-anchor="middle">machine starts</text>
    <text class="sub" x="75" y="92" text-anchor="middle">again</text>
  </g>

  <g transform="translate(380,100)">
    <rect class="step" width="150" height="120" rx="12"/>
    <circle class="num" cx="24" cy="24" r="14"/>
    <text class="numText" x="24" y="29" text-anchor="middle">3</text>
    <text class="label" x="75" y="55" text-anchor="middle">Boot task</text>
    <text class="sub" x="75" y="75" text-anchor="middle">~2 min later</text>
    <text class="sub" x="75" y="92" text-anchor="middle">-Mode Repair</text>
  </g>

  <g transform="translate(550,100)">
    <rect class="step" width="150" height="120" rx="12"/>
    <circle class="num" cx="24" cy="24" r="14"/>
    <text class="numText" x="24" y="29" text-anchor="middle">4</text>
    <text class="label" x="75" y="55" text-anchor="middle">Regenerate</text>
    <text class="sub" x="75" y="75" text-anchor="middle">offsets +</text>
    <text class="sub" x="75" y="92" text-anchor="middle">MaxSessions=0</text>
  </g>

  <g transform="translate(720,100)">
    <rect class="step" width="150" height="120" rx="12"/>
    <circle class="num" cx="24" cy="24" r="14"/>
    <text class="numText" x="24" y="29" text-anchor="middle">5</text>
    <text class="label" x="75" y="55" text-anchor="middle">Multi-session</text>
    <text class="sub" x="75" y="75" text-anchor="middle">3+ Active users</text>
    <text class="sub" x="75" y="92" text-anchor="middle">query user</text>
  </g>
</svg>
